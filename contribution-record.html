<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Check Contribution Records | ARS Prayer Warriors</title>

<link rel="stylesheet" href="../style.css">

<style>

.box h2,
.result-card h2{
text-align:center;
font-family:Arial, sans-serif;
font-weight:700;
}

table{
width:100%;
border-collapse:collapse;
margin-top:20px;
}

th,td{
padding:12px;
border:1px solid #ddd;
text-align:left;
}

input{
width:100%;
padding:10px;
margin:8px 0;
}

button{
padding:10px 15px;
cursor:pointer;
margin-top:10px;
}

.box{
margin-bottom:30px;
}

.result-card{
padding:15px;
margin-top:20px;
}

.payment-box{
margin-top:30px;
padding:20px;
background:#f5f5f5;
border-radius:10px;
text-align:center;
line-height:1.8;
}

.payment-box h3{
margin-bottom:15px;
}

.payment-box p{
margin:10px 0;
}

/* NEW STATUS BAR */

.status-container{
margin-top:30px;
}

.status-title{
text-align:center;
font-size:18px;
font-weight:bold;
color:#003399;
margin-bottom:10px;
}

.status-bar{
width:100%;
height:30px;
background:#003399;
border-radius:30px;
overflow:hidden;
}

.status-fill{
height:100%;
background:#00c853;
display:flex;
align-items:center;
justify-content:center;
color:#fff;
font-weight:bold;
transition:.5s;
}

.total-box{
margin-top:12px;
text-align:center;
font-size:18px;
font-weight:bold;
color:#003399;
}

.print-btn{
display:block;
margin:30px auto 0;
padding:12px 25px;
background:#003399;
color:#fff;
border:none;
border-radius:8px;
font-size:16px;
font-weight:bold;
cursor:pointer;
}

.print-btn:hover{
background:#001f66;
}

</style>

</head>

<body>

<header>

<div class="logo">

<h2>
ARS Prayer Warriors
</h2>

<p>
Check Contribution Records
</p>

</div>

</header>

<section class="prayer">

<div class="box">

<h2>
View Your Contribution Records
</h2>

<p>
Enter your name and phone number to check your contribution history.
</p>

<form id="checkForm">

<input
id="memberName"
type="text"
placeholder="Enter Full Name"
required>

<input
id="memberPhone"
type="text"
placeholder="Enter Phone Number"
required>

<button type="submit">
Check Records
</button>

</form>

</div>

<div class="box">

<h2>
Your Contribution History
</h2>

<div id="result" class="result-card">

<p>
Enter your details above to view your records.
</p>

</div>

</div>

</section>

<footer>

<h3>
ARS Prayer Warriors
</h3>

<p>
The Home of Prayer
</p>

<p>
© 2026 ARS Prayer Warriors
</p>

</footer>

<script type="module">
  import { initializeApp } from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getFirestore,
collection,
getDocs
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {

apiKey: "AIzaSyCVdwVvhwDaohSisqWzPirzJr7pGsyVwuc",

authDomain: "ars-prayer-warriors-2.firebaseapp.com",

projectId: "ars-prayer-warriors-2",

storageBucket: "ars-prayer-warriors-2.firebasestorage.app",

messagingSenderId: "65956421710",

appId: "1:65956421710:web:8dd96b64409a289216a31f"

};

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);

const form = document.getElementById("checkForm");

const result = document.getElementById("result");

form.addEventListener("submit", async(e)=>{

e.preventDefault();

const name = document
.getElementById("memberName")
.value
.trim();

const phone = document
.getElementById("memberPhone")
.value
.trim();

result.innerHTML = "Checking records...";

try{

const snapshot = await getDocs(
collection(db,"contributions")
);

let found = false;
let total = 0;
let memberInfo = null;

const targetAmount = 1000;

let output = `
<table>

<tr>

<th>Amount</th>

<th>Period</th>

<th>Starting Month</th>

<th>Year</th>

</tr>
`;
  snapshot.forEach((item)=>{

const data = item.data();

const member = (data.member || "").trim().toLowerCase();

const memberPhone = (data.phone || "").trim();

if(
member === name.toLowerCase()
&&
memberPhone === phone
){

found = true;

total += Number(data.amount);

if(!memberInfo){
memberInfo = data;
}

output += `

<tr>

<td>GHS ${data.amount}</td>

<td>${data.period || ""}</td>

<td>${data.startMonth || ""}</td>

<td>${data.startYear || ""}</td>

</tr>

`;

}

});

const percentage = Math.min(
Math.round((total / targetAmount) * 100),
100
);

output += `

</table>

<div class="status-container">

<div class="status-title">

Current Contribution Status

</div>

<div class="status-bar">

<div class="status-fill" style="width:${percentage}%">

${percentage}%

</div>

</div>

<div class="total-box">

GHS ${total} Contributed

</div>

</div>

<div class="payment-box">

<h3 style="color:#003399;">

AGBEDEDEDOR CONTRIBUTION PAYMENT DETAILS

</h3>

<p>

Kindly send your contribution payment through our Mobile Money Account. God bless you always.

</p>

<p>

<strong>MoMo Number:</strong> 0537139111

</p>

<p>

<strong>Name:</strong> ELIKPLIM VIVOR

</p>

<p>

<strong>Reference:</strong> Use your Full Name

</p>

</div>

<button class="print-btn" onclick="window.print()">

Print / Download Receipt

</button>

`;
  if(found){

result.innerHTML = `

<div style="
text-align:center;
margin-bottom:20px;
">

<h2 style="color:#003399;">

${name}

</h2>

<p>

<strong>Contribution:</strong>

${memberInfo.contributionType || "Contribution"}

</p>

<p>

<strong>Phone:</strong>

${phone}

</p>

</div>

${output}

`;

}else{

result.innerHTML = `

<p style="
text-align:center;
color:#cc0000;
font-weight:bold;
">

No contribution record found.

<br><br>

Please check your name and phone number and try again.

</p>

`;

}

}catch(error){

console.log(error);

result.innerHTML = `

<p style="
text-align:center;
color:#cc0000;
font-weight:bold;
">

Unable to check records at the moment.

Please try again later.

</p>

`;

}

});

</script>

</body>

</html>
